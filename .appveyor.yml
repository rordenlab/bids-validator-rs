environment:
  matrix:
    - job_name: win
      appveyor_build_worker_image: Visual Studio 2022

    - job_name: linux
      appveyor_build_worker_image: Ubuntu2004

    - job_name: mac
      appveyor_build_worker_image: macos-monterey

matrix:
  fast_finish: true

version: build-{build}

configuration: Release

platform: x64

clone_depth: 1

init:
  - ps: >-
      $env:DATE = $(Get-Date -Format d-MMM-yyyy)

      $githash = $env:APPVEYOR_REPO_COMMIT.Substring(0, 7)

      $gittag = if ($env:APPVEYOR_REPO_TAG -eq $True) {"_$($env:APPVEYOR_REPO_TAG_NAME)"} else {""}

      Update-AppveyorBuild -Version "$($env:DATE)_g${githash}${gittag}"

      $env:RELEASE_VERSION = $(Get-Date -Format d-MMMM-yyyy)

for:
  -
    matrix:
      only:
        - job_name: win

    build_script:
      # Rust is not preinstalled on the VS2022 image, so install via rustup.
      # PATH set with `set` does not persist across AppVeyor script lines, so
      # chain it with the build on a single line.
      - appveyor-retry appveyor DownloadFile https://win.rustup.rs/x86_64 -FileName rustup-init.exe
      - rustup-init.exe -y --profile minimal --default-toolchain stable
      - set "PATH=%USERPROFILE%\.cargo\bin;%PATH%" && cargo build --release --locked

    after_build:
      - 7z a bids-validator_win.zip .\target\release\bids-validator.exe >$null
      - appveyor PushArtifact bids-validator_win.zip

  -
    matrix:
      only:
        - job_name: linux

    build_script:
      - rustup default stable
      - cargo build --release --locked

    after_build:
      - strip -sx target/release/bids-validator
      - 7z a bids-validator_lnx.zip ./target/release/bids-validator &>/dev/null
      - appveyor PushArtifact bids-validator_lnx.zip

  -
    matrix:
      only:
        - job_name: mac

    build_script:
      # Universal (x86_64 + arm64) binary, matching the dcm2niix/niimath approach.
      - rustup default stable
      - rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - cargo build --release --locked --target x86_64-apple-darwin
      - cargo build --release --locked --target aarch64-apple-darwin

    after_build:
      - lipo -create -output bids-validator target/x86_64-apple-darwin/release/bids-validator target/aarch64-apple-darwin/release/bids-validator
      - lipo -info bids-validator   # expect: x86_64 arm64
      - strip -Sx bids-validator
      - 7z a bids-validator_mac.zip ./bids-validator &>/dev/null
      - appveyor PushArtifact bids-validator_mac.zip
