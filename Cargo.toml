[package]
name = "bids-validator-rs"
version = "0.1.20260517"
edition = "2021"
license = "MIT"
repository = "https://github.com/bids-standard/bids-validator-rs"
description = "Native Rust BIDS Validator beta built against a pinned BIDS Validator release."
build = "build.rs"

[[bin]]
name = "bids-validator"
path = "src/main.rs"

[lib]
name = "bids_validator_rs"
path = "src/lib.rs"

[workspace]
resolver = "2"
members = [
    ".",
    "crates/bids-schema-codegen",
    "crates/bids-expr",
    "crates/bids-core",
]

[workspace.package]
version = "0.1.20260517"
edition = "2021"
license = "MIT"
repository = "https://github.com/bids-standard/bids-validator-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
walkdir.workspace = true
clap.workspace = true
anyhow.workspace = true
ignore = "0.4"
bids-core = { path = "crates/bids-core" }
bids-expr = { path = "crates/bids-expr" }
bids-schema-codegen = { path = "crates/bids-schema-codegen" }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "validator_perf"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = "line-tables-only"

[package.metadata.bids-validator]
upstream_version = "2.4.1"
upstream_commit = "94ea9719efbbac7531fed8ad8a2a7bf764cee51f"
upstream_archive = "https://github.com/bids-standard/bids-validator/archive/94ea9719efbbac7531fed8ad8a2a7bf764cee51f.tar.gz"
